# Canonical smoke configuration for --automated and --emit-artifacts.
schema_version = 1
hostname = "reproos-smoke"

[regional]
locale = "en_US.UTF-8"
timezone = "UTC"
keymap = "us"

[user]
name = "repro"
full_name = "Repro Test User"
password_hash = "$6$reproosMvpD1$rrZAqlA3J4u9SLnxnaWWMcQAgVTXMplGNjmnt7yfZP3SyxEv.kE8Va8VbPVD0WBmlLhRrPYz3wO/U5O7Q1mvJ/"
